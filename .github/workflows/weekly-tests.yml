name: Weekly Platform Tests

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly test run
        run: |
          curl -X POST https://rei-weekly-test-runner-production.up.railway.app/api/run-tests \
            -H "Content-Type: application/json" \
            -d '{}'
        continue-on-error: true
